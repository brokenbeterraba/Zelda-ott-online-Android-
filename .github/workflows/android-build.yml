name: Android APK build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Commits fixados do port Android 9.2.3.
  LUS_SHA: 3a9af4fc67ddc2d476f204fdc43f87dc363ee0e0
  ZAPDTR_SHA: 1aa5bfc16cba8e487077a2a1f5ab7d5263ecf508
  OTREXPORTER_SHA: 77d47bc6d1767edb56f7cd461c5e1b7681f36a93

jobs:
  build:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: djvdw7f2ro/android-builder-soh:v1.0.4

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Fetch pinned native dependencies
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          fetch_dep() {
            local path="$1" url="$2" sha="$3"
            rm -rf "$path"
            mkdir -p "$path"
            git -C "$path" init -q
            git -C "$path" remote add origin "$url"
            git -C "$path" fetch -q --depth 1 origin "$sha"
            git -C "$path" checkout -q FETCH_HEAD
            git -C "$path" submodule update --init --recursive --depth 1

            local got
            got="$(git -C "$path" rev-parse HEAD)"
            [[ "$got" == "$sha" ]] || {
              echo "::error::$path em $got, esperado $sha"
              exit 1
            }
            echo "$path @ $got"
          }

          fetch_dep libultraship https://github.com/please-be-nice/libultraship.git "$LUS_SHA"
          fetch_dep ZAPDTR https://github.com/please-be-nice/ZAPDTR.git "$ZAPDTR_SHA"
          fetch_dep OTRExporter https://github.com/please-be-nice/OTRExporter.git "$OTREXPORTER_SHA"

          for f in \
            libultraship/CMakeLists.txt \
            libultraship/src/fast/shaders \
            libultraship/src/ship/Context.cpp \
            ZAPDTR/ZAPD/CMakeLists.txt \
            OTRExporter/extract_assets.py \
            patches/libultraship-android-data-root.patch \
            patches/libultraship-touch-camera-active.patch \
            Android/gradlew; do
            test -e "$f" || {
              echo "::error::Faltando: $f"
              exit 1
            }
          done

          cd libultraship
          for p in \
            ../patches/libultraship-android-data-root.patch \
            ../patches/libultraship-touch-camera-active.patch; do
            git apply --check --ignore-whitespace --whitespace=nowarn "$p" || {
              echo "::error::Patch não aplica no libultraship fixado: $p"
              exit 1
            }
          done

          echo "Dependências e patches OK."

      - name: Write local.properties
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > Android/local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> Android/local.properties

      - name: Install host build dependencies
        run: |
          apt-get update
          apt-get install -y $(cat .github/workflows/apt-deps.txt)

      # --- Cache de compilação: a 1ª rodada é lenta; as seguintes recompilam só o que mudou. ---
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-v1-${{ github.sha }}
          restore-keys: |
            ccache-v1-

      - name: Restore Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            /root/.gradle/caches
            /root/.gradle/wrapper
          key: gradle-v1-${{ hashFiles('Android/**/*.gradle', 'Android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-v1-

      - name: Configure ccache
        shell: bash
        run: |
          {
            echo "USE_CCACHE=1"
            echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache"
            echo "CCACHE_MAXSIZE=4G"
            echo "CCACHE_NOHASHDIR=1"
            echo "CCACHE_COMPILERCHECK=content"
            echo "CCACHE_BASEDIR=$GITHUB_WORKSPACE"
          } >> "$GITHUB_ENV"
          ccache --version | head -1

      - name: Generate soh.o2r
        shell: bash
        run: |
          set -euo pipefail

          cmake -S . -B build-linux -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          cmake --build build-linux --target GenerateSohOtr --parallel

          test -f soh/soh.o2r || {
            echo "::error::O arquivo soh/soh.o2r não foi gerado."
            exit 1
          }

          mkdir -p Android/app/src/main/assets
          cp soh/soh.o2r Android/app/src/main/assets/soh.o2r

          echo "soh.o2r gerado e copiado com sucesso."

      - name: Build APK (debug-signed, installable)
        id: build
        shell: bash
        run: |
          set -euo pipefail
          cd Android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug 2>&1 | tee ../android-build.log

      - name: Diagnose ALL errors (ninja -k 0, reaproveita o que já compilou)
        if: always() && steps.build.outcome == 'failure'
        continue-on-error: true
        shell: bash
        run: |
          NINJA_FILE="$(find Android/app/.cxx -name build.ninja -path '*arm64-v8a*' 2>/dev/null | head -1 || true)"
          if [[ -z "$NINJA_FILE" ]]; then
            echo "build.ninja não encontrado (falha antes da compilação nativa)."
            exit 0
          fi
          echo "Diretório: $(dirname "$NINJA_FILE")"
          # -k 0: não para no primeiro erro; mostra todos os arquivos com problema e os erros de link.
          timeout 100m ninja -C "$(dirname "$NINJA_FILE")" -k 0 2>&1 | tee all-errors.log || true

      - name: Extract first real errors
        if: always() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            if [[ -s all-errors.log ]]; then
              echo '## TODOS os erros (ninja -k 0)'
              echo '### Arquivos que falharam ao compilar'
              echo '```'
              grep -E '^FAILED:' all-errors.log | sed -E 's/^FAILED: //; s/ +$//' | sort -u | cut -c1-300 | head -80
              echo '```'
              echo '### Mensagens de erro (únicas, com contagem)'
              echo '```'
              grep -E ' error: |fatal error:' all-errors.log \
                | sed -E 's#^.*/(soh|server|libultraship)/#\1/#' | cut -c1-300 | sort | uniq -c | sort -rn | head -80
              echo '```'
              echo '### Símbolos indefinidos (link)'
              echo '```'
              grep -oE 'undefined (reference|symbol): [^ ]+' all-errors.log | sort -u | cut -c1-250 | head -200
              echo '```'
            fi
            echo '## Primeiros erros reais do build'
            echo '```'
            grep -n -m1 -B2 -A25 -E \
              'FAILED:|error:|fatal error|CMake Error|undefined reference|ld(\.lld)?: error|patch does not apply' \
              android-build.log | cut -c1-400 \
              || echo "(nenhum padrão de erro encontrado; veja o fim do log)"
            echo '```'
            echo '## Últimas 60 linhas'
            echo '```'
            tail -n 60 android-build.log | cut -c1-400
            echo '```'
          } > build-error-report.md

          cat build-error-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Save ccache (mesmo se o build falhou)
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-v1-${{ github.sha }}

      - name: Upload log and error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: |
            android-build.log
            all-errors.log
            build-error-report.md
          if-no-files-found: warn
          retention-days: 14

      - name: Validate APK
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find Android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit 2>/dev/null || true)"

          [[ -n "$APK" ]] || {
            echo "::error::Nenhum APK gerado"
            exit 1
          }

          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          unzip -tq "$APK"

          LIST="$(unzip -Z1 "$APK")"

          for need in \
            AndroidManifest.xml \
            classes.dex \
            assets/soh.o2r \
            lib/arm64-v8a/libSDL2.so \
            lib/arm64-v8a/libsoh.so \
            lib/arm64-v8a/libootserver.so; do
            grep -qx "$need" <<<"$LIST" || {
              echo "::error::APK sem $need"
              exit 1
            }
          done

          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "APK válido, com bibliotecas arm64-v8a."

      - name: Upload APK
        if: success() && steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: shipwright-online-android-apk
          path: ${{ steps.validate.outputs.apk }}
          if-no-files-found: error
          retention-days: 14

  report-error:
    name: Publicar erro na issue
    needs: build
    if: always() && needs.build.result == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
      actions: read
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-build-log
        continue-on-error: true

      - name: Comment on issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          TITLE="Relatório de build CI"

          N="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$TITLE\" in:title" \
            --json number \
            --jq '.[0].number' || true)"

          if [[ -z "$N" ]]; then
            N="$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "Erros do build publicados automaticamente pelo workflow." \
              | grep -oE '[0-9]+$')"
          fi

          {
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID (commit ${GITHUB_SHA::7})"
            echo

            if [[ -f build-error-report.md ]]; then
              head -c 60000 build-error-report.md
            elif [[ -f android-build.log ]]; then
              echo "Log disponível, mas relatório não foi gerado."
              tail -n 100 android-build.log
            else
              echo "O build falhou antes de gerar o log. Veja o run acima."
            fi
          } > comment.md

          gh issue comment "$N" \
            --repo "$GITHUB_REPOSITORY" \
            --body-file comment.md
